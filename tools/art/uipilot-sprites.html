<!doctype html>
<!--
  UIPilot sprite kit — vector source. build-sprites.ps1 screenshots this page with a
  transparent background and cuts it into the PNGs in UIPilot/Assets/UIPilot/Art.

  Rules (design-system/uipilot, MASTER section 5a + pages/generated-menus.md): everything
  is WHITE on transparent so Unity tints it; authored at 2x (Pixels Per Unit 200).
  Positions and sizes here must match the table in build-sprites.ps1.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 1024px; height: 704px; position: relative; overflow: hidden; }
  svg { position: absolute; display: block; }
  .icon { fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .icon .solid { fill: #fff; stroke-width: 1.2; }
</style>
</head>
<body>

<!-- uipilot_glow  160x160 @ (16,16)  border 72 — blooms, halos -->
<svg style="left:16px;top:16px" width="160" height="160" viewBox="0 0 160 160">
  <defs><filter id="blurA" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="17"/></filter></defs>
  <rect x="46" y="46" width="68" height="68" rx="30" fill="#FFFFFF" filter="url(#blurA)"/>
</svg>

<!-- uipilot_focus  192x192 @ (192,16)  border 72 — halo + hairline frame + faint fill, one graphic -->
<svg style="left:192px;top:16px" width="192" height="192" viewBox="0 0 192 192">
  <!-- The halo is a blurred OUTLINE, not a blurred fill: light hugs the frame and the
       interior stays clear, so white text on it keeps its contrast. -->
  <defs><filter id="blurB" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter></defs>
  <rect x="48" y="48" width="96" height="96" fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.62" filter="url(#blurB)"/>
  <rect x="48" y="48" width="96" height="96" fill="#FFFFFF" opacity="0.06"/>
  <rect x="49" y="49" width="94" height="94" fill="none" stroke="#FFFFFF" stroke-width="2"/>
</svg>

<!-- uipilot_frame  64x64 @ (400,16)  border 8 — 1-unit hairline rectangle -->
<svg style="left:400px;top:16px" width="64" height="64" viewBox="0 0 64 64">
  <rect x="1" y="1" width="62" height="62" fill="none" stroke="#FFFFFF" stroke-width="2"/>
</svg>

<!-- uipilot_fade  256x16 @ (480,16)  opaque (left) to clear (right) -->
<svg style="left:480px;top:16px" width="256" height="16" viewBox="0 0 256 16">
  <defs>
    <linearGradient id="fadeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="0.7"  stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="16" fill="url(#fadeH)"/>
</svg>

<!-- uipilot_shade  16x256 @ (752,16)  clear (top) to opaque (bottom) -->
<svg style="left:752px;top:16px" width="16" height="256" viewBox="0 0 16 256">
  <defs>
    <linearGradient id="fadeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="16" height="256" fill="url(#fadeV)"/>
</svg>

<!-- uipilot_cross  48x48 @ (784,16) — registration mark -->
<svg style="left:784px;top:16px" width="48" height="48" viewBox="0 0 48 48">
  <rect x="6" y="23" width="36" height="2" fill="#FFFFFF"/>
  <rect x="23" y="6" width="2" height="36" fill="#FFFFFF"/>
</svg>

<!-- uipilot_scanlines  16x16 @ (848,16) — tiles; 4 px on, 4 px off -->
<svg style="left:848px;top:16px" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect x="0" y="0" width="16" height="4" fill="#FFFFFF"/>
  <rect x="0" y="8" width="16" height="4" fill="#FFFFFF"/>
</svg>

<!-- uipilot_wave  1024x320 @ (0,224) — the ribbon of light -->
<svg style="left:0;top:224px" width="1024" height="320" viewBox="0 0 1024 320">
  <defs>
    <filter id="blurW" x="-5%" y="-40%" width="110%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blurW2" x="-5%" y="-40%" width="110%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <linearGradient id="waveEnds" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.82" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="waveMask"><rect width="1024" height="320" fill="url(#waveEnds)"/></mask>
  </defs>
  <g mask="url(#waveMask)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <!-- translucent body between the two main curves -->
    <path d="M0 196 C 170 110, 330 262, 520 178 S 850 72, 1024 150
             L 1024 196 C 860 120, 700 250, 530 226 S 190 170, 0 236 Z"
          fill="#FFFFFF" stroke="none" opacity="0.16"/>
    <!-- bloom under the leading edge -->
    <path d="M0 196 C 170 110, 330 262, 520 178 S 850 72, 1024 150" stroke-width="16" opacity="0.30" filter="url(#blurW)"/>
    <!-- leading edge, and its trailing echoes -->
    <path d="M0 196 C 170 110, 330 262, 520 178 S 850 72, 1024 150" stroke-width="3.2" opacity="0.95" filter="url(#blurW2)"/>
    <path d="M0 214 C 185 138, 335 270, 528 200 S 855 98, 1024 172" stroke-width="1.6" opacity="0.62"/>
    <path d="M0 236 C 190 170, 360 276, 530 226 S 860 120, 1024 196" stroke-width="2.2" opacity="0.5" filter="url(#blurW2)"/>
    <path d="M0 176 C 160 84, 320 250, 512 156 S 846 44, 1024 124" stroke-width="1.2" opacity="0.38"/>
  </g>
</svg>

<!-- Icons: 96x96 each, 24-unit grid, row at y=576, x = 16 + n*112 -->

<!-- 0 play -->
<svg class="icon" style="left:16px;top:576px" width="96" height="96" viewBox="0 0 24 24">
  <path class="solid" d="M8.5 5.6v12.8L18.6 12z"/>
</svg>

<!-- 1 settings (sliders) -->
<svg class="icon" style="left:128px;top:576px" width="96" height="96" viewBox="0 0 24 24">
  <path d="M4 7h9M18 7h2M4 12h2M11 12h9M4 17h11"/>
  <circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="12" r="2.3"/><circle cx="17.5" cy="17" r="2.3"/>
</svg>

<!-- 2 quit (power) -->
<svg class="icon" style="left:240px;top:576px" width="96" height="96" viewBox="0 0 24 24">
  <path d="M12 3.5v8.5"/>
  <path d="M7.1 6.6a7.5 7.5 0 1 0 9.8 0"/>
</svg>

<!-- 3 back (arrow left) -->
<svg class="icon" style="left:352px;top:576px" width="96" height="96" viewBox="0 0 24 24">
  <path d="M19.5 12h-15M10.5 6l-6 6 6 6"/>
</svg>

<!-- 4 volume (speaker) -->
<svg class="icon" style="left:464px;top:576px" width="96" height="96" viewBox="0 0 24 24">
  <path d="M4 9.5v5h3.5l5 4v-13l-5 4z"/>
  <path d="M16 9.2a4 4 0 0 1 0 5.6M18.7 6.5a7.8 7.8 0 0 1 0 11"/>
</svg>

<!-- 5 fullscreen (corner brackets) -->
<svg class="icon" style="left:576px;top:576px" width="96" height="96" viewBox="0 0 24 24">
  <path d="M4.5 9.5v-5h5M19.5 9.5v-5h-5M4.5 14.5v5h5M19.5 14.5v5h-5"/>
</svg>

<!-- 6 quality (layers) -->
<svg class="icon" style="left:688px;top:576px" width="96" height="96" viewBox="0 0 24 24">
  <path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8z"/>
  <path d="M3.5 12.2l8.5 4.5 8.5-4.5M3.5 16.2l8.5 4.5 8.5-4.5"/>
</svg>

<!-- 7 chevron left -->
<svg class="icon" style="left:800px;top:576px" width="96" height="96" viewBox="0 0 24 24">
  <path d="M14.5 5.5l-6.5 6.5 6.5 6.5"/>
</svg>

<!-- 8 chevron right -->
<svg class="icon" style="left:912px;top:576px" width="96" height="96" viewBox="0 0 24 24">
  <path d="M9.5 5.5l6.5 6.5-6.5 6.5"/>
</svg>

</body>
</html>
