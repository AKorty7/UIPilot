<script>
(async()=>{
const root=document.getElementById('material-loading'),canvas=root.querySelector('canvas'),error=root.querySelector('.ml-error');

const themes={
 military:{name:'Military Shooter',description:'Layered anodised metal alignment brackets with a satin chevron and green glass insert',environment:'#becbca'},
 scifi:{name:'Sci-Fi HUD',description:'Silver orbital instrument with cyan glass plates and a moving orbit marker',environment:'#c2d7df'},
 fantasy:{name:'Fantasy RPG',description:'Antique gold crest surrounding a burgundy enamel diamond',environment:'#dbccb2'},
 jrpg:{name:'JRPG Window',description:'A cut blue glass crystal inside a polished silver command frame',environment:'#c9d5ed'},
 night:{name:'Soft Club Night',description:'A smoked lilac glass lens suspended inside two polished silver elliptical rims',environment:'#c5c5df'},
 neumorphic:{name:'Dark Neumorphism',description:'A smooth graphite recessed dial with a polished ring and moving pale indicator',environment:'#c6d1d2'},
 ink:{name:'Ink',description:'An ivory porcelain frame and a black lacquer folded seal',environment:'#dfded5'},
 pixel:{name:'Pixel Retro',description:'A stepped mint enamel cursor with continuous satin lilac framing',environment:'#d9d0e4'},

};
const motionValues=['auto','play','paused','reduced'],preference=matchMedia('(prefers-reduced-motion: reduce)');

const state={theme:themes[saved?.theme]?saved.theme:'military',motion:motionValues.includes(saved?.motion)?saved.motion:'auto',complete:saved?.complete===true};
let dispose=()=>{};
try{
const THREE=await import('https://esm.sh/three@0.179.1');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setClearColor(0,0);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;

const hemi=new THREE.HemisphereLight(0xf0f6ff,0x28313b,.85);scene.add(hemi);
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-3,5,4);scene.add(light);
// Dark studio walls and broad light cards keep material colour and edge reflections distinct.
const studio=new THREE.Scene();studio.background=new THREE.Color('#38434f');
function lightPanel(color,intensity,w,h,x,y,z){const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(color).multiplyScalar(intensity),side:THREE.DoubleSide}));p.position.set(x,y,z);p.lookAt(0,0,0);studio.add(p);}
lightPanel('#ffffff',4,3,7,-4,2,3);lightPanel('#e6ffff',2.5,1.3,8,4,1,1);lightPanel('#ffffff',3.5,6,2,0,5,-1);lightPanel('#111a28',.2,7,5,0,-1,-4);lightPanel('#ced7c8',.65,5,4,1,-4,1);lightPanel('#c7d4da',.65,5,5,0,1,5);
const pmrem=new THREE.PMREMGenerator(renderer),environment=pmrem.fromScene(studio,.06);scene.environment=environment.texture;pmrem.dispose();release(studio);
let model=new THREE.Group(),pose=()=>{},elapsed=0,last=0,raf=0,disposed=false;scene.add(model);
function release(group){const geometries=new Set(),materials=new Set();group.traverse(o=>{if(o.geometry)geometries.add(o.geometry);if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>materials.add(m));});geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());}
