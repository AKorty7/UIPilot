#uip-reflective [data-theme="military"][data-screen="loading"][data-backdrop="reflections"] .scene{background-color:#080d0f;background-image:repeating-linear-gradient(135deg,transparent 0 54px,#a0c6c10a 54px 55px)}
#uip-reflective [data-theme="military"] .load-art .a{inset:15%;background:linear-gradient(#bed8d1,#bed8d1) left top/28px 2px no-repeat,linear-gradient(#bed8d1,#bed8d1) left top/2px 28px no-repeat,linear-gradient(#bed8d1,#bed8d1) right top/28px 2px no-repeat,linear-gradient(#bed8d1,#bed8d1) right top/2px 28px no-repeat,linear-gradient(#bed8d1,#bed8d1) left bottom/28px 2px no-repeat,linear-gradient(#bed8d1,#bed8d1) left bottom/2px 28px no-repeat,linear-gradient(#bed8d1,#bed8d1) right bottom/28px 2px no-repeat,linear-gradient(#bed8d1,#bed8d1) right bottom/2px 28px no-repeat}
#uip-reflective [data-theme="military"] .load-art .b{left:28%;right:28%;top:28%;height:17%;clip-path:polygon(0 0,50% 45%,100% 0,100% 40%,50% 85%,0 40%);background:#adc6bf}
#uip-reflective [data-theme="military"] .load-art .c{left:28%;right:28%;top:44%;height:17%;clip-path:polygon(0 0,50% 45%,100% 0,100% 40%,50% 85%,0 40%);background:#78b4ad}
#uip-reflective [data-theme="military"] .load-art .d{left:28%;right:28%;top:60%;height:5%;background:repeating-linear-gradient(90deg,#5b837e 0 4px,transparent 4px 8px)}
#uip-reflective [data-theme="military"] .load-art .e{left:15%;right:15%;top:10%;height:3px;background:repeating-linear-gradient(90deg,#77928d 0 19px,transparent 19px 24px)}
#uip-reflective [data-theme="military"] .load-art .f{left:15%;right:15%;bottom:10%;height:3px;background:repeating-linear-gradient(90deg,#77928d 0 19px,transparent 19px 24px)}

/* Horror: interrupted chalk seal and worn vertical registration. */
#uip-reflective [data-theme="horror"][data-screen="loading"][data-backdrop="reflections"] .scene{background-color:#171817;background-image:repeating-linear-gradient(90deg,transparent 0 91px,#c2c0a80b 91px 92px,transparent 92px 97px,#c2c0a805 97px 98px)}

@media(max-width:640px){#uip-reflective .game-stage[data-screen="loading"] .loading-inner{grid-template-columns:1fr;gap:20px;padding:23px 22px}#uip-reflective .game-stage[data-screen="loading"] .load-visual{min-height:230px}#uip-reflective .game-stage[data-screen="loading"] .loading-panel{gap:18px;min-height:0}#uip-reflective .game-stage[data-screen="loading"] .load-art{max-width:260px}#uip-reflective .game-stage[data-screen="loading"] .loading-inner h1{font-size:29px}#uip-reflective [data-theme="pixel"][data-screen="loading"] .loading-inner h1{font-size:24px}#uip-reflective .study-nav #uip-advance{margin-left:0;border-left:0}}
/* Loading motion: only ornaments move; layout, patterns and text remain still. */
#uip-reflective .motion-picker{display:flex;gap:8px;align-items:center;padding:7px 10px;font-size:12px;color:var(--studio-muted)}
#uip-reflective .motion-picker[hidden]{display:none}
#uip-reflective .motion-picker select{background:#202528;border:1px solid var(--studio-line);border-radius:3px;padding:7px;color:var(--studio-ink);min-height:34px}
#uip-reflective [data-theme="neumorphic"] .load-art .f{inset:19%;border:3px solid transparent;border-top-color:#c2dce4;border-right-color:#6c8c9c;border-radius:50%;transform:rotate(-35deg);}
#uip-reflective [data-theme="neumorphic"] .load-art .f:after{content:'';position:absolute;top:10%;right:10%;width:8px;height:8px;border-radius:50%;background:#e3f4fa;box-shadow:0 0 0 3px #25333e}
#uip-reflective [data-theme="scifi"] .load-art .f{inset:0;width:auto;height:auto;border-radius:0;background:none;box-shadow:none;}
#uip-reflective [data-theme="scifi"] .load-art .f:before{content:'';position:absolute;left:48%;top:12%;width:4%;height:4%;border-radius:50%;background:#c0eef2;box-shadow:0 0 0 4px #142b38,0 0 0 5px #6f9ead}
#uip-reflective .motion-picker{flex-wrap:wrap}
#uip-reflective #uip-motion-status{font-size:11px;color:#becdca}
@media(pointer:coarse){#uip-reflective .motion-picker select{min-height:44px;font-size:16px}}
</style>
<script>
(()=>{
const root=document.getElementById('uip-reflective');
const stage=root.querySelector('.game-stage'),content=root.querySelector('.game-content'),picker=root.querySelector('#uip-theme'),backdropPicker=root.querySelector('#uip-backdrop'),status=root.querySelector('#uip-status');
const themes={
neumorphic:{name:'Dark Neumorphism',title:['Main','menu'],material:'Graphite surfaces / raised controls and recessed settings'},
soft:{name:'Soft Club',title:['soft','club'],material:'Gen X Soft Club / silver, mist blue, mint and cobalt controls'},
night:{name:'Soft Club Night',title:['Main','menu'],material:'Smoked blue panels / silver edges and lilac selection'},
ink:{name:'Ink',title:['Main','menu'],material:'Uncoated ivory / charcoal rules and solid ink selection'},
fantasy:{name:'Fantasy RPG',title:['Main','menu'],material:'Layered gold frames / burgundy insets and serif controls'},
jrpg:{name:'JRPG Window',title:['Main','menu'],material:'Classic blue windows / silver bevels and diamond selection'},
pixel:{name:'Pixel Retro',title:['Main','menu'],material:'Stepped bevels / pixel type and a block cursor'},
scifi:{name:'Sci-Fi HUD',title:['Main','menu'],material:'Observatory instruments / blue steel frames and cyan controls'},
military:{name:'Military Shooter',title:['MAIN','MENU'],material:'Military / monochrome instrument frames, cyan focus and green selection'},
horror:{name:'Survival Horror',title:['Main','menu'],material:'Worn charcoal / chalk lettering and faded red selection'}
};
const screens={main:'Main menu',settings:'Settings',pause:'Pause',loading:'Loading',states:'Control states'};
const state={theme:'military',screen:'loading',backdrop:'reflections',volume:75,music:45,subtitles:true,quality:'High',progress:38,motion:'auto'};
function restore(snapshot){const s=snapshot?.privateContent||snapshot?.modelContent;if(!s)return;if(['auto','play','reduced','paused'].includes(s.motion))state.motion=s.motion;const theme=themes[s.theme]?s.theme:Object.keys(themes).find(k=>themes[k].name===s.theme);if(theme)state.theme=theme;const screen=screens[s.screen]?s.screen:Object.keys(screens).find(k=>screens[k]===s.screen);if(screen)state.screen=screen;if(['reflections','plain','bright'].includes(s.backdrop))state.backdrop=s.backdrop;for(const k of ['volume','music','progress'])if(Number.isFinite(s[k]))state[k]=Math.max(0,Math.min(100,s[k]));if(typeof s.subtitles==='boolean')state.subtitles=s.subtitles;if(['Low','Medium','High'].includes(s.quality))state.quality=s.quality;}
function save(){try{window.openai?.setWidgetState({modelContent:{theme:themes[state.theme].name,screen:screens[state.screen],backdrop:state.backdrop,motion:state.motion},privateContent:{...state}})?.catch(()=>{});}catch{}}
restore(window.openai?.widgetState);
picker.innerHTML=Object.entries(themes).map(([id,t])=>`<option value="${id}">${t.name}</option>`).join('');
const button=(label,action,cls='')=>`<button type="button" class="game-button cursor-interaction ${cls}" data-action="${action}">${label}</button>`;
const motionPreference=window.matchMedia('(prefers-reduced-motion: reduce)');
let loadingAnimations=[];
const motionFrames={
turn:[{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],
rock:[{transform:'rotate(-9deg) scale(1)'},{transform:'rotate(9deg) scale(1.03)'},{transform:'rotate(-9deg) scale(1)'}],
breathe:[{transform:'scale(.94)',opacity:.7},{transform:'scale(1.04)',opacity:1},{transform:'scale(.94)',opacity:.7}],
float:[{transform:'translateY(5px)'},{transform:'translateY(-7px)'},{transform:'translateY(5px)'}],
lens:[{transform:'scale(1,.94)',opacity:.84},{transform:'scale(1,1.06)',opacity:1},{transform:'scale(1,.94)',opacity:.84}],
glisten:[{opacity:.55},{opacity:1},{opacity:.55}],
satellite:[{transform:'translateY(4px) rotate(0deg)'},{transform:'translateY(-8px) rotate(90deg)'},{transform:'translateY(4px) rotate(0deg)'}],
step:[{transform:'translate(0,0)'},{transform:'translate(16px,0)'},{transform:'translate(16px,16px)'},{transform:'translate(0,16px)'},{transform:'translate(0,0)'}],
pixel:[{opacity:1},{opacity:.65},{opacity:1}],
chevron:[{transform:'translateY(0)',opacity:.58,offset:0},{transform:'translateY(5px)',opacity:1,offset:.35},{transform:'translateY(0)',opacity:.58,offset:.7},{transform:'translateY(0)',opacity:.58,offset:1}],
unease:[{transform:'rotate(-4deg)',opacity:.6,offset:0},{transform:'rotate(3deg)',opacity:.9,offset:.4},{transform:'rotate(1deg)',opacity:.75,offset:.65},{transform:'rotate(-4deg)',opacity:.6,offset:1}]
};
// Part, motion, duration in seconds, optional phase and playback direction.
const loadingTracks={
neumorphic:[['c','turn',12],['d','breathe',3.6],['f','turn',3.6]],
soft:[['a','rock',7],['b','rock',9,-3,'reverse'],['c','float',5]],
night:[['a','rock',10],['c','lens',7]],
ink:[['a','turn',24],['d','breathe',4]],
fantasy:[['c','turn',28],['d','breathe',5],['e','glisten',5],['f','glisten',5,-2.5]],
jrpg:[['c','float',4.8],['d','float',4.8],['e','satellite',6],['f','satellite',6,-3,'reverse']],
pixel:[['d','step',3.2],['e','step',3.2,0,'reverse'],['b','pixel',3.2]],
scifi:[['b','turn',24],['c','turn',32,0,'reverse'],['f','turn',8]],
military:[['b','chevron',2.8],['c','chevron',2.8,-.7],['d','glisten',2.8,-1.4]],
horror:[['a','unease',12],['b','unease',16,-5,'reverse'],['c','glisten',8]]
};
function applyPlayback(){
const reduced=state.motion==='reduced'||(state.motion==='auto'&&motionPreference.matches);
for(const animation of loadingAnimations){
if(reduced){animation.cancel();continue;}
if(state.motion==='paused'||state.progress===100){animation.pause();continue;}
animation.play();
}
}
function startLoadingMotion(){
if(state.screen!=='loading')return;
for(const [part,name,seconds,phase=0,direction='normal'] of loadingTracks[state.theme]){
const element=content.querySelector('.load-art .'+part);
const base=getComputedStyle(element).transform;
const frames=motionFrames[name].map(frame=>({...frame,...(frame.transform?{transform:(base==='none'?'':base+' ')+frame.transform}:{})}));
const easing=name==='turn'?'linear':name==='step'?'steps(2,end)':name==='pixel'?'steps(1,end)':'ease-in-out';
loadingAnimations.push(element.animate(frames,{duration:seconds*1000,delay:phase*1000,easing,iterations:Infinity,direction}));
}
applyPlayback();
}
function syncMotion(){stage.dataset.motion=state.motion;stage.dataset.complete=String(state.progress===100);root.querySelector('#uip-motion').value=state.motion;root.querySelector('#uip-motion-control').hidden=state.screen!=='loading';root.querySelector('#uip-motion-status').textContent=state.progress===100?'Complete':state.motion==='paused'?'Paused':state.motion==='reduced'?'Motion off':state.motion==='auto'&&motionPreference.matches?'System: reduced motion':'Playing';applyPlayback();}
function render(){
loadingAnimations.forEach(animation=>animation.cancel());loadingAnimations=[];
syncMotion();
backdropPicker.options[0].textContent='Theme canvas';backdropPicker.options[1].textContent='Dark canvas';backdropPicker.options[2].textContent='Light canvas';
const t=themes[state.theme];stage.dataset.theme=state.theme;stage.dataset.screen=state.screen;stage.dataset.revised=String(!['soft','military'].includes(state.theme));stage.dataset.backdrop=state.backdrop;picker.value=state.theme;backdropPicker.value=state.backdrop;root.querySelector('.footer-theme').textContent=t.name.toUpperCase();root.querySelector('#uip-material').textContent=t.material;status.textContent=screens[state.screen];root.querySelectorAll('.study-nav [data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===state.screen)));const advance=root.querySelector('#uip-advance');advance.hidden=state.screen!=='loading';advance.textContent=state.progress===100?'Restart loading preview':'Advance loading preview';
if(state.screen==='main')content.innerHTML=`<section class="menu-panel" aria-label="Main menu"><p class="eyebrow">${state.theme==='military'?'Military':state.theme==='soft'?'Main menu':t.name}</p><h1>${t.title.map(s=>`<span>${s}</span>`).join('')}</h1><div class="panel-rule"></div><div class="menu-actions">${button('Continue','continue','primary')}${button('New game','new')}${button('Settings','settings')}${button('Credits','credits','quiet')}</div></section>`;
if(state.screen==='pause')content.innerHTML=`<section class="menu-panel" aria-label="Pause menu"><p class="eyebrow">Game paused</p><h1>Take your<br>time.</h1><div class="panel-rule"></div><p class="save-note">Your progress is saved.</p><div class="menu-actions">${button('Resume','resume','primary')}${button('Settings','settings')}${button('Main menu','main','quiet')}</div></section>`;
if(state.screen==='settings')content.innerHTML=`<section class="menu-panel settings-panel" aria-label="Settings menu"><p class="eyebrow">Preferences</p><h1>Settings</h1><div class="panel-rule"></div><div class="setting-group"><h2>Sound</h2><div class="setting-row"><label for="uip-volume">Master volume</label><div class="range-control"><input id="uip-volume" type="range" min="0" max="100" value="${state.volume}"><output for="uip-volume">${state.volume}</output></div></div><div class="setting-row"><label for="uip-music">Music</label><div class="range-control"><input id="uip-music" type="range" min="0" max="100" value="${state.music}"><output for="uip-music">${state.music}</output></div></div></div><div class="setting-group"><h2>Display</h2><div class="setting-row"><label for="uip-quality">Graphics quality</label><select id="uip-quality" class="cursor-interaction">${['Low','Medium','High'].map(v=>`<option ${v===state.quality?'selected':''}>${v}</option>`).join('')}</select></div><div class="setting-row"><label for="uip-subtitles">Subtitles</label><label class="check-row"><input id="uip-subtitles" type="checkbox" ${state.subtitles?'checked':''}><span>${state.subtitles?'On':'Off'}</span></label></div></div><div class="settings-back">${button('Back','back')}</div></section>`;
if(state.screen==='loading')content.innerHTML=`<section class="loading-panel" aria-label="${t.name} loading screen"><div class="load-visual" aria-hidden="true"><div class="load-art"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="e"></i><i class="f"></i></div></div><div class="loading-inner"><div><p class="eyebrow">${t.name}</p><h1>${state.progress===100?'Ready':'Loading'}</h1></div><div><div class="progress-label"><span>${state.progress===100?'Complete':'Loading your game'}</span><span id="uip-progress-text">${state.progress}%</span></div><progress max="100" value="${state.progress}" aria-label="Example loading progress"></progress><p class="loading-tip">You can adjust sound and display options in Settings.</p></div></div></section>`;
if(state.screen==='states')content.innerHTML=`<section class="menu-panel states-panel" aria-label="Shared control states"><p class="eyebrow">${t.name} / component study</p><h1>Control states</h1><div class="panel-rule"></div><div class="state-grid">${[['Idle',''],['Hover','is-hover'],['Focus','is-focus'],['Pressed','is-pressed'],['Selected','primary'],['Disabled','disabled']].map(([name,cls])=>`<div class="state-sample"><span>${name}</span><button class="game-button cursor-interaction ${cls==='disabled'?'':cls}" ${cls==='disabled'?'disabled':''} data-action="sample">Continue</button></div>`).join('')}</div><div class="state-swatches">${[['Surface','--surface'],['Text','--ink'],['Secondary','--muted'],['Accent','--accent']].map(([n,v])=>`<span class="swatch"><i style="background:var(${v})" aria-hidden="true"></i>${n}</span>`).join('')}</div></section>`;
startLoadingMotion();
}
let returnScreen='main';
function show(screen){state.screen=screen;render();save();}
root.querySelectorAll('.study-nav [data-screen]').forEach(b=>b.addEventListener('click',()=>{returnScreen='main';show(b.dataset.screen);}));
root.querySelector('#uip-motion').addEventListener('change',e=>{state.motion=e.target.value;syncMotion();save();});
motionPreference.addEventListener('change',syncMotion);
picker.addEventListener('change',()=>{state.theme=picker.value;render();save();});
root.querySelector('#uip-advance').addEventListener('click',()=>{state.progress=state.progress===100?38:Math.min(100,state.progress+31);render();save();});
backdropPicker.addEventListener('change',()=>{state.backdrop=backdropPicker.value;render();save();});
content.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='settings'){returnScreen=state.screen;show('settings');}else if(a==='back')show(returnScreen);else if(a==='main')show('main');else if(a==='resume'){show('main');status.textContent='Resume selected · preview only';}else if(a==='continue'||a==='new'){state.progress=38;show('loading');}else if(a==='credits'){status.textContent='UIPilot · theme design study';}else if(a==='sample'){status.textContent='Continue selected · sample control';}});
content.addEventListener('input',e=>{const k=e.target.id==='uip-volume'?'volume':e.target.id==='uip-music'?'music':null;if(k){state[k]=Number(e.target.value);e.target.nextElementSibling.textContent=state[k];}});
content.addEventListener('change',e=>{if(e.target.id==='uip-subtitles'){state.subtitles=e.target.checked;e.target.nextElementSibling.textContent=state.subtitles?'On':'Off';}if(e.target.id==='uip-quality')state.quality=e.target.value;save();});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.screen!=='main'){show(state.screen==='settings'?returnScreen:'main');}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){const previous=JSON.stringify(state);restore(e.detail.globals.widgetState);if(JSON.stringify(state)!==previous)render();}});
render();
})();
</script>
