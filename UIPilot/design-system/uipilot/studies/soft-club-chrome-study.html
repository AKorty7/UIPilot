<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<section id="soft-chrome" aria-label="Soft Club 3D material study">
  <header class="sc-toolbar"><span>SOFT CLUB <span class="sc-study">/ material study</span></span><label>Motion <select id="sc-motion" class="cursor-interaction"><option value="auto">Follow system</option><option value="play">Play</option><option value="paused">Pause</option><option value="reduced">Reduced</option></select></label></header>
  <div class="sc-screen">
    <div class="sc-visual" aria-label="A smooth reflective chrome ribbon and a translucent mint glass insert"><canvas aria-label="Animated 3D chrome and mint glass sculpture"></canvas><p class="sc-error" role="status">Preparing material preview…</p></div>
    <div class="sc-loading"><div><span class="sc-kicker">soft club</span><h1>Loading</h1></div><div class="sc-progress"><div><span>Loading your game</span><span>38%</span></div><progress value="38" max="100" aria-label="Example loading progress"></progress></div></div>
  </div>
</section>
<style>
#soft-chrome{font:14px/1.5 'Work Sans',sans-serif;color:#203a59;background:#dce6e8;width:100%;box-sizing:border-box}
#soft-chrome *{box-sizing:border-box}
#soft-chrome .sc-toolbar{background:#101719;color:#dbe6e5;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding:16px 24px;font-size:12px;letter-spacing:.06em}
#soft-chrome .sc-study{color:#a3b6b9;letter-spacing:0;margin-left:6px}
#soft-chrome label{display:flex;align-items:center;gap:9px}
#soft-chrome select{font:inherit;color:#e7f1ef;background:#243033;border:1px solid #526468;border-radius:3px;padding:8px;min-height:36px}
#soft-chrome .sc-screen{position:relative;background:linear-gradient(115deg,#cedde5,#e5eeeb 65%,#d4e3df);overflow:hidden;padding-bottom:36px}
#soft-chrome .sc-visual{height:460px;width:100%;position:relative}
#soft-chrome canvas{width:100%;height:100%;display:block}
#soft-chrome .sc-error{position:absolute;inset:42% 24px auto;text-align:center;font-size:14px;color:#254260}
#soft-chrome .sc-error[hidden]{display:none}
#soft-chrome .sc-loading{position:relative;margin:0 6%;padding:25px 30px;background:#edf4f2;box-shadow:inset 0 1px #fff,0 12px 28px #4d718017;border:1px solid #a4bfc7;border-radius:2px 28px 2px 2px;display:grid;grid-template-columns:1fr 1.2fr;align-items:center;gap:30px}
#soft-chrome .sc-kicker{font-size:12px;letter-spacing:.14em;font-style:italic;color:#4b687e}
#soft-chrome h1{font:400 29px/1.5 'Michroma',sans-serif;letter-spacing:-.05em;margin:7px 0 0;color:#244e87}
#soft-chrome .sc-progress>div{display:flex;justify-content:space-between;gap:15px;font-size:12px;color:#405e72;margin-bottom:12px}
#soft-chrome progress{display:block;width:100%;height:4px;appearance:none;border:0;background:#cedee4;color:#3b6198}
#soft-chrome progress::-webkit-progress-bar{background:#cedee4}
#soft-chrome progress::-webkit-progress-value{background:#3b6198}
#soft-chrome progress::-moz-progress-bar{background:#3b6198}
@media(max-width:540px){#soft-chrome .sc-toolbar{padding:15px 18px}#soft-chrome .sc-study{display:none}#soft-chrome .sc-visual{height:340px}#soft-chrome .sc-loading{grid-template-columns:1fr;padding:22px;gap:24px}#soft-chrome h1{font-size:25px}}
@media(pointer:coarse){#soft-chrome select{min-height:44px;font-size:16px}}
</style>
<script>
(async()=>{
const root=document.getElementById('soft-chrome'),canvas=root.querySelector('canvas'),message=root.querySelector('.sc-error'),picker=root.querySelector('#sc-motion');
const preference=window.matchMedia('(prefers-reduced-motion: reduce)');
const saved=window.openai?.widgetState?.privateContent;
const state={motion:['auto','play','paused','reduced'].includes(saved?.motion)?saved.motion:'auto',roughness:.14};
picker.value=state.motion;
try{
const THREE=await import('https://esm.sh/three@0.179.1');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));renderer.setClearColor(0xdce6e8,0);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,1,.1,60);
camera.position.set(0,.15,6.6);camera.lookAt(0,0,0);
// A studio made from diffuse walls and broad luminous panels; no external imagery.
const studio=new THREE.Scene();studio.background=new THREE.Color('#c3d4da');
const panel=(color,intensity,w,h,x,y,z)=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(color).multiplyScalar(intensity),side:THREE.DoubleSide}));p.position.set(x,y,z);p.lookAt(0,0,0);studio.add(p);};
panel('#ffffff',5,4,7,-4,2,3);panel('#e6ffff',3,2,8,4,1,1);panel('#ffffff',4,6,3,0,5,-1);panel('#142b49',.35,7,5,0,-1,-4);panel('#b8dacb',1.1,5,4,1,-4,1);
const pmrem=new THREE.PMREMGenerator(renderer),environment=pmrem.fromScene(studio,.06);
scene.environment=environment.texture;pmrem.dispose();studio.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});
scene.add(new THREE.HemisphereLight(0xe7fffb,0x718598,2));
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-3,5,4);scene.add(light);
const group=new THREE.Group();scene.add(group);
// Closed, rounded ribbon with a variable cross-section and a continuous twist.
const positions=[],indices=[],length=256,radial=32;
for(let i=0;i<=length;i++){
const u=i/length*Math.PI*2,cu=Math.cos(u),su=Math.sin(u),twist=u+.3;
const breadth=.2+.035*Math.sin(u*2),thickness=.045;
for(let j=0;j<=radial;j++){
const v=j/radial*Math.PI*2,a=Math.cos(v)*breadth,b=Math.sin(v)*thickness;
const outward=a*Math.cos(twist)-b*Math.sin(twist),depth=a*Math.sin(twist)+b*Math.cos(twist);
positions.push(1.22*cu+.1*Math.sin(u*2)+cu*outward,.91*su+su*outward,.17*Math.sin(u*2)+depth);
}
}
for(let i=0;i<length;i++)for(let j=0;j<radial;j++){const a=i*(radial+1)+j,b=a+radial+1;indices.push(a,b,a+1,b,b+1,a+1);}
const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geometry.setIndex(indices);geometry.computeVertexNormals();
const chrome=new THREE.MeshPhysicalMaterial({color:0xe1ebee,metalness:1,roughness:state.roughness,clearcoat:.6,clearcoatRoughness:.16,envMapIntensity:1.05,side:THREE.DoubleSide});
const ribbon=new THREE.Mesh(geometry,chrome);ribbon.rotation.set(.18,-.35,-.4);group.add(ribbon);
// A slim glass insert, with rounded polished edges.
const shape=new THREE.Shape(),w=.93,h=.49,r=.16;
shape.moveTo(-w+r,-h);shape.lineTo(w-r,-h);shape.quadraticCurveTo(w,-h,w,-h+r);shape.lineTo(w,h-r);shape.quadraticCurveTo(w,h,w-r,h);shape.lineTo(-w+r,h);shape.quadraticCurveTo(-w,h,-w,h-r);shape.lineTo(-w,-h+r);shape.quadraticCurveTo(-w,-h,-w+r,-h);
const glassGeometry=new THREE.ExtrudeGeometry(shape,{depth:.065,bevelEnabled:true,bevelSegments:5,steps:1,bevelSize:.035,bevelThickness:.035,curveSegments:24});glassGeometry.center();
const glassMaterial=new THREE.MeshPhysicalMaterial({color:0xc1e9d5,metalness:0,roughness:.16,transmission:.86,thickness:.45,ior:1.46,transparent:true,opacity:1,envMapIntensity:1.1,clearcoat:1,attenuationColor:new THREE.Color(0x7cbea3),attenuationDistance:1.5});
const glass=new THREE.Mesh(glassGeometry,glassMaterial);glass.position.set(.43,-.12,-.38);glass.scale.set(.77,.77,1);glass.rotation.set(-.2,.35,-.4);group.add(glass);
// Soft contact shadow, generated as a rendering primitive.
const shadowCanvas=document.createElement('canvas');shadowCanvas.width=128;shadowCanvas.height=128;const sc=shadowCanvas.getContext('2d'),gradient=sc.createRadialGradient(64,64,2,64,64,64);gradient.addColorStop(0,'rgba(38,63,77,.23)');gradient.addColorStop(1,'rgba(38,63,77,0)');sc.fillStyle=gradient;sc.fillRect(0,0,128,128);
const shadowTexture=new THREE.CanvasTexture(shadowCanvas),shadow=new THREE.Mesh(new THREE.PlaneGeometry(3.8,.65),new THREE.MeshBasicMaterial({map:shadowTexture,transparent:true,depthWrite:false}));shadow.position.set(0,-1.3,-.5);scene.add(shadow);
let elapsed=0,last=0,raf=0,disposed=false;
function draw(){group.rotation.y=Math.sin(elapsed*.3)*.42;group.rotation.x=Math.sin(elapsed*.22)*.12;group.position.y=.08+Math.sin(elapsed*.5)*.045;ribbon.rotation.z=-.4+Math.sin(elapsed*.24)*.07;renderer.render(scene,camera);}
function tick(now){if(disposed)return;if(!last)last=now;if(now-last>1000/30){elapsed+=Math.min((now-last)/1000,.1);last=now;draw();}raf=requestAnimationFrame(tick);}
function applyMotion(){cancelAnimationFrame(raf);last=0;const reduced=state.motion==='reduced'||(state.motion==='auto'&&preference.matches);if(reduced)elapsed=0;draw();if(!reduced&&state.motion!=='paused')raf=requestAnimationFrame(tick);}
function resize(){const box=canvas.parentElement.getBoundingClientRect();renderer.setSize(box.width,box.height,false);camera.aspect=box.width/box.height;camera.position.z=box.width<500?8.8:6.6;camera.updateProjectionMatrix();draw();}
const observer=new ResizeObserver(resize);observer.observe(canvas.parentElement);resize();message.hidden=true;applyMotion();
picker.addEventListener('change',()=>{state.motion=picker.value;applyMotion();window.openai?.setWidgetState({modelContent:{theme:'Soft Club',study:'Chrome ribbon 3D',motion:state.motion},privateContent:{...state}})?.catch(()=>{});});
preference.addEventListener('change',applyMotion);
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&['auto','play','paused','reduced'].includes(s.motion)&&s.motion!==state.motion){state.motion=s.motion;picker.value=s.motion;applyMotion();}});
if(typeof Tweak!=='undefined'){const tweak=new Tweak({container:root,onChange:()=>{chrome.roughness=state.roughness;draw();}});tweak.addSlider(state,'roughness',{label:'Chrome softness',min:.08,max:.3,step:.01});}
window.addEventListener('pagehide',()=>{disposed=true;cancelAnimationFrame(raf);observer.disconnect();scene.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});environment.dispose();shadowTexture.dispose();renderer.dispose();},{once:true});
}catch(error){message.hidden=false;message.textContent='The 3D preview could not start in this view.';console.error(error);}
})();
</script>
